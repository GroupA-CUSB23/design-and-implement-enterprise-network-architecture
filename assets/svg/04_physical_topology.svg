<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Arial, sans-serif">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1000" height="700" fill="#F4F6F7"/>

  <text x="500" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#2C3E50">Physical Topology - Data Center Rack Layout</text>
  <text x="500" y="52" text-anchor="middle" font-size="13" fill="#7F8C8D">Head Office (ភ្នំពេញ)</text>

  <!-- Rack 1: Network -->
  <g>
    <rect x="60" y="80" width="280" height="560" rx="8" fill="#2C3E50" filter="url(#sh)"/>
    <rect x="70" y="90" width="260" height="20" fill="#34495E"/>
    <text x="200" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="white">RACK 1 - NETWORK</text>

    <!-- Rack Units -->
    <g font-size="10" fill="white">
      <rect x="80" y="120" width="240" height="30" fill="#7F8C8D" stroke="#95A5A6"/>
      <text x="90" y="139">U42-U41: Cable Management + Patch Panel</text>

      <rect x="80" y="155" width="240" height="35" fill="#2874A6" stroke="#3498DB"/>
      <text x="90" y="170" font-weight="bold">U40: Edge Router</text>
      <text x="90" y="184" font-size="9">Cisco ASR 1001-HX</text>

      <rect x="80" y="195" width="240" height="35" fill="#C0392B" stroke="#E74C3C"/>
      <text x="90" y="210" font-weight="bold">U39: Firewall-1 (Active)</text>
      <text x="90" y="224" font-size="9">Fortigate 600F NGFW</text>

      <rect x="80" y="235" width="240" height="35" fill="#E67E22" stroke="#F39C12"/>
      <text x="90" y="250" font-weight="bold">U38: Firewall-2 (Standby)</text>
      <text x="90" y="264" font-size="9">Fortigate 600F HA</text>

      <rect x="80" y="275" width="240" height="35" fill="#1F618D" stroke="#2E86C1"/>
      <text x="90" y="290" font-weight="bold">U37: Core Switch-1</text>
      <text x="90" y="304" font-size="9">Cisco Nexus 9336C-FX2 (VPC)</text>

      <rect x="80" y="315" width="240" height="35" fill="#1F618D" stroke="#2E86C1"/>
      <text x="90" y="330" font-weight="bold">U36: Core Switch-2</text>
      <text x="90" y="344" font-size="9">Cisco Nexus 9336C-FX2 (VPC)</text>

      <rect x="80" y="355" width="240" height="25" fill="#148F77" stroke="#1ABC9C"/>
      <text x="90" y="372" font-weight="bold">U35: Distribution SW-1 (9500)</text>

      <rect x="80" y="385" width="240" height="25" fill="#148F77" stroke="#1ABC9C"/>
      <text x="90" y="402" font-weight="bold">U34: Distribution SW-2 (9500)</text>

      <rect x="80" y="415" width="240" height="25" fill="#148F77" stroke="#1ABC9C"/>
      <text x="90" y="432" font-weight="bold">U33: Distribution SW-3 (9500)</text>

      <rect x="80" y="445" width="240" height="25" fill="#148F77" stroke="#1ABC9C"/>
      <text x="90" y="462" font-weight="bold">U32: Distribution SW-4 (9500)</text>

      <rect x="80" y="475" width="240" height="30" fill="#6C3483" stroke="#8E44AD"/>
      <text x="90" y="490" font-weight="bold">U31: Wireless Controller</text>
      <text x="90" y="502" font-size="9">Cisco 9800-40</text>

      <rect x="80" y="510" width="240" height="70" fill="#7F8C8D" stroke="#95A5A6"/>
      <text x="90" y="530" font-weight="bold">U30-U15: Access Switches</text>
      <text x="90" y="547" font-size="9">Cisco Catalyst 9200-48P (x20)</text>
      <text x="90" y="562" font-size="9">PoE+ for IP Phone / AP</text>

      <rect x="80" y="585" width="240" height="45" fill="#34495E" stroke="#5D6D7E"/>
      <text x="90" y="605" font-weight="bold">U2-U1: UPS + PDU</text>
      <text x="90" y="622" font-size="9">APC Smart-UPS 3000</text>
    </g>
  </g>

  <!-- Rack 2: Servers -->
  <g>
    <rect x="360" y="80" width="280" height="560" rx="8" fill="#2C3E50" filter="url(#sh)"/>
    <rect x="370" y="90" width="260" height="20" fill="#34495E"/>
    <text x="500" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="white">RACK 2 - SERVERS</text>

    <g font-size="10" fill="white">
      <rect x="380" y="120" width="240" height="25" fill="#7F8C8D" stroke="#95A5A6"/>
      <text x="390" y="137">U42: KVM Console</text>

      <rect x="380" y="150" width="240" height="40" fill="#1E8449" stroke="#27AE60"/>
      <text x="390" y="167" font-weight="bold">U40: Core Banking Server</text>
      <text x="390" y="181" font-size="9">Temenos T24 (10.10.20.10)</text>

      <rect x="380" y="195" width="240" height="40" fill="#1E8449" stroke="#27AE60"/>
      <text x="390" y="212" font-weight="bold">U38: Database Primary</text>
      <text x="390" y="226" font-size="9">Oracle DB (10.10.20.20)</text>

      <rect x="380" y="240" width="240" height="40" fill="#1E8449" stroke="#27AE60"/>
      <text x="390" y="257" font-weight="bold">U36: Database Backup</text>
      <text x="390" y="271" font-size="9">Oracle Standby</text>

      <rect x="380" y="285" width="240" height="40" fill="#1E8449" stroke="#27AE60"/>
      <text x="390" y="302" font-weight="bold">U34: Application Server</text>
      <text x="390" y="316" font-size="9">Web/API Layer (10.10.20.30)</text>

      <rect x="380" y="330" width="240" height="40" fill="#1E8449" stroke="#27AE60"/>
      <text x="390" y="347" font-weight="bold">U32: AD / DNS Server</text>
      <text x="390" y="361" font-size="9">Windows Server 2022</text>

      <rect x="380" y="375" width="240" height="40" fill="#1E8449" stroke="#27AE60"/>
      <text x="390" y="392" font-weight="bold">U30: Backup Server</text>
      <text x="390" y="406" font-size="9">Veeam / Commvault</text>

      <rect x="380" y="420" width="240" height="40" fill="#6C3483" stroke="#8E44AD"/>
      <text x="390" y="437" font-weight="bold">U28: SIEM Server</text>
      <text x="390" y="451" font-size="9">Splunk Enterprise</text>

      <rect x="380" y="465" width="240" height="30" fill="#7F8C8D" stroke="#95A5A6"/>
      <text x="390" y="483" font-weight="bold">U26-U5: Available Slots</text>

      <rect x="380" y="500" width="240" height="130" fill="#34495E" stroke="#5D6D7E"/>
      <text x="390" y="520" font-weight="bold">U4-U1: UPS + PDU</text>
      <text x="390" y="540" font-size="9">Dual PSU Redundancy</text>
      <text x="390" y="555" font-size="9">Backed up by Generator</text>
    </g>
  </g>

  <!-- Rack 3: DMZ -->
  <g>
    <rect x="660" y="80" width="280" height="290" rx="8" fill="#2C3E50" filter="url(#sh)"/>
    <rect x="670" y="90" width="260" height="20" fill="#34495E"/>
    <text x="800" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="white">RACK 3 - DMZ</text>

    <g font-size="10" fill="white">
      <rect x="680" y="120" width="240" height="40" fill="#B7950B" stroke="#F1C40F"/>
      <text x="690" y="137" font-weight="bold">U40: Web Server</text>
      <text x="690" y="151" font-size="9">Internet Banking (172.16.99.10)</text>

      <rect x="680" y="165" width="240" height="40" fill="#B7950B" stroke="#F1C40F"/>
      <text x="690" y="182" font-weight="bold">U38: Mail Server</text>
      <text x="690" y="196" font-size="9">MS Exchange (172.16.99.20)</text>

      <rect x="680" y="210" width="240" height="40" fill="#B7950B" stroke="#F1C40F"/>
      <text x="690" y="227" font-weight="bold">U36: External DNS</text>
      <text x="690" y="241" font-size="9">Public DNS (172.16.99.30)</text>

      <rect x="680" y="255" width="240" height="40" fill="#B7950B" stroke="#F1C40F"/>
      <text x="690" y="272" font-weight="bold">U34: WAF (Web App Firewall)</text>
      <text x="690" y="286" font-size="9">F5 / Cloudflare</text>

      <rect x="680" y="300" width="240" height="60" fill="#34495E" stroke="#5D6D7E"/>
      <text x="690" y="322" font-weight="bold">U2-U1: UPS</text>
    </g>
  </g>

  <!-- Cabling Info -->
  <g>
    <rect x="660" y="390" width="280" height="250" rx="8" fill="white" stroke="#BDC3C7" stroke-width="2" filter="url(#sh)"/>
    <text x="800" y="415" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50">🔌 Cabling Standards</text>

    <line x1="680" y1="425" x2="920" y2="425" stroke="#BDC3C7"/>

    <g font-size="10" fill="#2C3E50">
      <text x="680" y="450" font-weight="bold" fill="#2874A6">Single-mode Fiber:</text>
      <text x="690" y="465">ISP → Router, WAN (10-40km)</text>

      <text x="680" y="490" font-weight="bold" fill="#27AE60">Multi-mode OM4:</text>
      <text x="690" y="505">Rack-to-Rack (400m, 10-40Gbps)</text>

      <text x="680" y="530" font-weight="bold" fill="#E67E22">Cat6a UTP:</text>
      <text x="690" y="545">Access → End-user (100m, 10G)</text>

      <text x="680" y="570" font-weight="bold" fill="#8E44AD">DAC (Direct Attach):</text>
      <text x="690" y="585">Server → ToR Switch (7m)</text>

      <text x="680" y="610" font-weight="bold" fill="#7F8C8D">Console (RJ45):</text>
      <text x="690" y="625">Management Access</text>
    </g>
  </g>
</svg>
