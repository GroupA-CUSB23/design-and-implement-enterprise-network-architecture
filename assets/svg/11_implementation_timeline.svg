<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" font-family="Arial, sans-serif">
  <defs>
    <filter id="sh">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1000" height="550" fill="#F4F6F7"/>

  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#2C3E50">Implementation Timeline (~3 Months)</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#7F8C8D">Phase-by-Phase Gantt Chart</text>

  <!-- Header Row (weeks) -->
  <g font-size="10" fill="#2C3E50">
    <rect x="200" y="90" width="720" height="30" fill="#2C3E50"/>
    <text x="240" y="110" text-anchor="middle" fill="white" font-weight="bold">W1</text>
    <text x="300" y="110" text-anchor="middle" fill="white" font-weight="bold">W2</text>
    <text x="360" y="110" text-anchor="middle" fill="white" font-weight="bold">W3</text>
    <text x="420" y="110" text-anchor="middle" fill="white" font-weight="bold">W4</text>
    <text x="480" y="110" text-anchor="middle" fill="white" font-weight="bold">W5</text>
    <text x="540" y="110" text-anchor="middle" fill="white" font-weight="bold">W6</text>
    <text x="600" y="110" text-anchor="middle" fill="white" font-weight="bold">W7</text>
    <text x="660" y="110" text-anchor="middle" fill="white" font-weight="bold">W8</text>
    <text x="720" y="110" text-anchor="middle" fill="white" font-weight="bold">W9</text>
    <text x="780" y="110" text-anchor="middle" fill="white" font-weight="bold">W10</text>
    <text x="840" y="110" text-anchor="middle" fill="white" font-weight="bold">W11</text>
    <text x="900" y="110" text-anchor="middle" fill="white" font-weight="bold">W12</text>
  </g>

  <!-- Grid lines -->
  <g stroke="#BDC3C7" stroke-width="0.5">
    <line x1="270" y1="120" x2="270" y2="480"/>
    <line x1="330" y1="120" x2="330" y2="480"/>
    <line x1="390" y1="120" x2="390" y2="480"/>
    <line x1="450" y1="120" x2="450" y2="480"/>
    <line x1="510" y1="120" x2="510" y2="480"/>
    <line x1="570" y1="120" x2="570" y2="480"/>
    <line x1="630" y1="120" x2="630" y2="480"/>
    <line x1="690" y1="120" x2="690" y2="480"/>
    <line x1="750" y1="120" x2="750" y2="480"/>
    <line x1="810" y1="120" x2="810" y2="480"/>
    <line x1="870" y1="120" x2="870" y2="480"/>
  </g>

  <!-- Phase 1: Planning (W1-W2) -->
  <text x="20" y="145" font-size="11" font-weight="bold" fill="#2C3E50">Phase 1: Planning</text>
  <rect x="210" y="130" width="120" height="30" rx="4" fill="#2E86C1" filter="url(#sh)"/>
  <text x="270" y="150" text-anchor="middle" font-size="10" fill="white">Requirements + Design</text>

  <text x="20" y="185" font-size="11" font-weight="bold" fill="#2C3E50">Vendor Selection</text>
  <rect x="270" y="170" width="120" height="30" rx="4" fill="#3498DB" filter="url(#sh)"/>
  <text x="330" y="190" text-anchor="middle" font-size="10" fill="white">Vendor + Budget</text>

  <!-- Phase 2: Hardware (W3-W6) -->
  <text x="20" y="225" font-size="11" font-weight="bold" fill="#2C3E50">Phase 2: Hardware</text>
  <rect x="330" y="210" width="180" height="30" rx="4" fill="#16A085" filter="url(#sh)"/>
  <text x="420" y="230" text-anchor="middle" font-size="10" fill="white">Equipment Procurement</text>

  <text x="20" y="265" font-size="11" font-weight="bold" fill="#2C3E50">Installation</text>
  <rect x="450" y="250" width="120" height="30" rx="4" fill="#27AE60" filter="url(#sh)"/>
  <text x="510" y="270" text-anchor="middle" font-size="10" fill="white">Rack + Cabling</text>

  <!-- Phase 3: Configuration (W7-W9) -->
  <text x="20" y="305" font-size="11" font-weight="bold" fill="#2C3E50">Phase 3: Config Core</text>
  <rect x="570" y="290" width="60" height="30" rx="4" fill="#8E44AD" filter="url(#sh)"/>
  <text x="600" y="310" text-anchor="middle" font-size="10" fill="white">Core+Dist</text>

  <text x="20" y="345" font-size="11" font-weight="bold" fill="#2C3E50">Config Access + Wi-Fi</text>
  <rect x="630" y="330" width="90" height="30" rx="4" fill="#9B59B6" filter="url(#sh)"/>
  <text x="675" y="350" text-anchor="middle" font-size="10" fill="white">Access + AP</text>

  <text x="20" y="385" font-size="11" font-weight="bold" fill="#2C3E50">Security + VPN</text>
  <rect x="690" y="370" width="90" height="30" rx="4" fill="#C0392B" filter="url(#sh)"/>
  <text x="735" y="390" text-anchor="middle" font-size="10" fill="white">Firewall + VPN</text>

  <!-- Phase 4: Testing (W10-W11) -->
  <text x="20" y="425" font-size="11" font-weight="bold" fill="#2C3E50">Phase 4: Testing</text>
  <rect x="750" y="410" width="90" height="30" rx="4" fill="#E67E22" filter="url(#sh)"/>
  <text x="795" y="430" text-anchor="middle" font-size="10" fill="white">Test + Audit</text>

  <!-- Phase 5: Go-Live (W12) -->
  <text x="20" y="465" font-size="11" font-weight="bold" fill="#2C3E50">Phase 5: Go-Live</text>
  <rect x="810" y="450" width="120" height="30" rx="4" fill="#F39C12" filter="url(#sh)"/>
  <text x="870" y="470" text-anchor="middle" font-size="10" fill="white">Rollout + Training</text>

  <!-- Legend -->
  <rect x="60" y="500" width="880" height="35" rx="6" fill="white" stroke="#BDC3C7"/>
  <g font-size="10" fill="#2C3E50">
    <rect x="80" y="510" width="12" height="12" fill="#2E86C1"/><text x="98" y="521">Planning (2wk)</text>
    <rect x="200" y="510" width="12" height="12" fill="#16A085"/><text x="218" y="521">Hardware (4wk)</text>
    <rect x="330" y="510" width="12" height="12" fill="#8E44AD"/><text x="348" y="521">Configuration (4wk)</text>
    <rect x="490" y="510" width="12" height="12" fill="#E67E22"/><text x="508" y="521">Testing (2wk)</text>
    <rect x="620" y="510" width="12" height="12" fill="#F39C12"/><text x="638" y="521">Go-Live (4wk)</text>
    <text x="770" y="521" font-weight="bold" fill="#C0392B">Total: 12 weeks (~3 months)</text>
  </g>
</svg>
