<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Arial, sans-serif">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495E"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="#F4F6F7"/>

  <text x="500" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#2C3E50">Logical Topology - Data Flow</text>

  <!-- Internet Cloud -->
  <ellipse cx="500" cy="80" rx="80" ry="35" fill="#5DADE2" stroke="#2874A6" stroke-width="2" filter="url(#sh)"/>
  <text x="500" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="white">INTERNET</text>
  <text x="500" y="95" text-anchor="middle" font-size="10" fill="white">BGP AS 65001</text>

  <line x1="500" y1="115" x2="500" y2="145" stroke="#34495E" stroke-width="2"/>

  <!-- Edge Router -->
  <rect x="440" y="145" width="120" height="45" rx="6" fill="#5D6D7E" filter="url(#sh)"/>
  <text x="500" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Edge Router</text>
  <text x="500" y="183" text-anchor="middle" font-size="10" fill="#EAECEE">Cisco ASR 1001-HX</text>

  <line x1="500" y1="190" x2="500" y2="220" stroke="#34495E" stroke-width="2"/>

  <!-- Firewall HA -->
  <rect x="420" y="220" width="80" height="55" rx="6" fill="#E74C3C" filter="url(#sh)"/>
  <text x="460" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Firewall-1</text>
  <text x="460" y="260" text-anchor="middle" font-size="9" fill="white">ACTIVE</text>
  <text x="460" y="272" text-anchor="middle" font-size="8" fill="#FADBD8">Fortigate 600F</text>

  <rect x="500" y="220" width="80" height="55" rx="6" fill="#E67E22" filter="url(#sh)"/>
  <text x="540" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Firewall-2</text>
  <text x="540" y="260" text-anchor="middle" font-size="9" fill="white">STANDBY</text>
  <text x="540" y="272" text-anchor="middle" font-size="8" fill="#FDEBD0">HA Pair</text>

  <line x1="490" y1="248" x2="510" y2="248" stroke="#C0392B" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- DMZ Zone -->
  <line x1="580" y1="248" x2="720" y2="248" stroke="#34495E" stroke-width="2"/>
  <rect x="720" y="215" width="180" height="65" rx="6" fill="#F1C40F" filter="url(#sh)"/>
  <text x="810" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#7D6608">DMZ Zone</text>
  <text x="810" y="255" text-anchor="middle" font-size="10" fill="#7D6608">172.16.99.0/24</text>
  <text x="810" y="270" text-anchor="middle" font-size="9" fill="#7D6608">Web, Mail, External DNS</text>

  <line x1="500" y1="275" x2="500" y2="305" stroke="#34495E" stroke-width="2"/>

  <!-- Core Switch -->
  <rect x="430" y="305" width="140" height="50" rx="6" fill="#2E86C1" filter="url(#sh)"/>
  <text x="500" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Core Switch (VPC HA)</text>
  <text x="500" y="345" text-anchor="middle" font-size="10" fill="#D6EAF8">Cisco Nexus 9336 x2</text>

  <line x1="500" y1="355" x2="500" y2="380" stroke="#34495E" stroke-width="2"/>
  <line x1="150" y1="380" x2="850" y2="380" stroke="#34495E" stroke-width="2"/>
  <line x1="150" y1="380" x2="150" y2="410" stroke="#34495E" stroke-width="2"/>
  <line x1="380" y1="380" x2="380" y2="410" stroke="#34495E" stroke-width="2"/>
  <line x1="620" y1="380" x2="620" y2="410" stroke="#34495E" stroke-width="2"/>
  <line x1="850" y1="380" x2="850" y2="410" stroke="#34495E" stroke-width="2"/>

  <!-- Server Zone -->
  <rect x="70" y="410" width="160" height="80" rx="6" fill="#27AE60" filter="url(#sh)"/>
  <text x="150" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Server Farm</text>
  <text x="150" y="450" text-anchor="middle" font-size="10" fill="#D5F5E3">VLAN 20</text>
  <text x="150" y="465" text-anchor="middle" font-size="9" fill="#D5F5E3">10.10.20.0/24</text>
  <text x="150" y="480" text-anchor="middle" font-size="9" fill="#D5F5E3">Core Banking, DB</text>

  <!-- User LAN -->
  <rect x="300" y="410" width="160" height="80" rx="6" fill="#3498DB" filter="url(#sh)"/>
  <text x="380" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="white">User LAN</text>
  <text x="380" y="450" text-anchor="middle" font-size="10" fill="#D6EAF8">VLAN 30 (STAFF)</text>
  <text x="380" y="465" text-anchor="middle" font-size="9" fill="#D6EAF8">10.10.30.0/23</text>
  <text x="380" y="480" text-anchor="middle" font-size="9" fill="#D6EAF8">Staff PCs, IP Phones</text>

  <!-- Wireless -->
  <rect x="540" y="410" width="160" height="80" rx="6" fill="#9B59B6" filter="url(#sh)"/>
  <text x="620" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Wireless</text>
  <text x="620" y="450" text-anchor="middle" font-size="10" fill="#E8DAEF">VLAN 60/70</text>
  <text x="620" y="465" text-anchor="middle" font-size="9" fill="#E8DAEF">Wi-Fi Corp + Guest</text>
  <text x="620" y="480" text-anchor="middle" font-size="9" fill="#E8DAEF">Cisco Wi-Fi 6</text>

  <!-- WAN Edge -->
  <rect x="770" y="410" width="160" height="80" rx="6" fill="#E67E22" filter="url(#sh)"/>
  <text x="850" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="white">WAN Edge</text>
  <text x="850" y="450" text-anchor="middle" font-size="10" fill="#FDEBD0">MPLS + IPsec VPN</text>
  <text x="850" y="465" text-anchor="middle" font-size="9" fill="#FDEBD0">To 5 Branches</text>
  <text x="850" y="480" text-anchor="middle" font-size="9" fill="#FDEBD0">Backup: 4G/LTE</text>

  <!-- MPLS Cloud -->
  <line x1="850" y1="490" x2="850" y2="520" stroke="#34495E" stroke-width="2"/>
  <ellipse cx="850" cy="545" rx="80" ry="25" fill="#9B59B6" opacity="0.7"/>
  <text x="850" y="550" text-anchor="middle" font-size="12" font-weight="bold" fill="white">MPLS Cloud</text>

  <!-- 5 Branches -->
  <line x1="850" y1="570" x2="850" y2="595" stroke="#34495E" stroke-width="2"/>
  <line x1="650" y1="595" x2="1050" y2="595" stroke="#34495E" stroke-width="1.5" transform="translate(-100,0)"/>

  <g font-size="10" fill="white">
    <rect x="560" y="605" width="60" height="35" rx="4" fill="#8E44AD"/>
    <text x="590" y="620" text-anchor="middle" font-weight="bold">SR</text>
    <text x="590" y="633" text-anchor="middle">10.20/16</text>

    <rect x="630" y="605" width="60" height="35" rx="4" fill="#8E44AD"/>
    <text x="660" y="620" text-anchor="middle" font-weight="bold">BB</text>
    <text x="660" y="633" text-anchor="middle">10.30/16</text>

    <rect x="700" y="605" width="60" height="35" rx="4" fill="#8E44AD"/>
    <text x="730" y="620" text-anchor="middle" font-weight="bold">KC</text>
    <text x="730" y="633" text-anchor="middle">10.40/16</text>

    <rect x="770" y="605" width="60" height="35" rx="4" fill="#8E44AD"/>
    <text x="800" y="620" text-anchor="middle" font-weight="bold">SH</text>
    <text x="800" y="633" text-anchor="middle">10.50/16</text>

    <rect x="840" y="605" width="60" height="35" rx="4" fill="#8E44AD"/>
    <text x="870" y="620" text-anchor="middle" font-weight="bold">KP</text>
    <text x="870" y="633" text-anchor="middle">10.60/16</text>
  </g>

  <!-- Legend -->
  <rect x="20" y="600" width="180" height="80" rx="4" fill="white" stroke="#BDC3C7"/>
  <text x="30" y="620" font-size="11" font-weight="bold" fill="#2C3E50">Legend:</text>
  <line x1="30" y1="635" x2="55" y2="635" stroke="#34495E" stroke-width="2"/>
  <text x="60" y="639" font-size="10" fill="#2C3E50">Physical Link</text>
  <line x1="30" y1="655" x2="55" y2="655" stroke="#C0392B" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="60" y="659" font-size="10" fill="#2C3E50">HA Sync</text>
</svg>
