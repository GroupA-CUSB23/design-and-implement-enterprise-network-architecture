<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Arial, sans-serif">
  <defs>
    <filter id="sh">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#27AE60"/>
    </marker>
    <marker id="arr-back" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#8E44AD"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="#F4F6F7"/>

  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#2C3E50">Internet Banking Transaction - End-to-End Flow</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#7F8C8D">Customer → Web → App → Database</text>

  <!-- Actors -->
  <g>
    <!-- Customer -->
    <rect x="30" y="90" width="110" height="70" rx="8" fill="#3498DB" filter="url(#sh)"/>
    <text x="85" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="white">👤 Customer</text>
    <text x="85" y="135" text-anchor="middle" font-size="10" fill="#D6EAF8">Internet</text>
    <text x="85" y="150" text-anchor="middle" font-size="9" fill="#D6EAF8">Browser/Mobile</text>

    <!-- Firewall -->
    <rect x="180" y="90" width="110" height="70" rx="8" fill="#E74C3C" filter="url(#sh)"/>
    <text x="235" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🛡️ Firewall</text>
    <text x="235" y="135" text-anchor="middle" font-size="10" fill="#FADBD8">Fortigate 600F</text>
    <text x="235" y="150" text-anchor="middle" font-size="9" fill="#FADBD8">NGFW + IPS</text>

    <!-- WAF -->
    <rect x="330" y="90" width="110" height="70" rx="8" fill="#F1C40F" filter="url(#sh)"/>
    <text x="385" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#7D6608">🔒 WAF</text>
    <text x="385" y="135" text-anchor="middle" font-size="10" fill="#7D6608">DMZ Zone</text>
    <text x="385" y="150" text-anchor="middle" font-size="9" fill="#7D6608">Anti-SQLi/XSS</text>

    <!-- Web Server -->
    <rect x="480" y="90" width="110" height="70" rx="8" fill="#27AE60" filter="url(#sh)"/>
    <text x="535" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🌐 Web Server</text>
    <text x="535" y="135" text-anchor="middle" font-size="10" fill="#D5F5E3">172.16.99.10</text>
    <text x="535" y="150" text-anchor="middle" font-size="9" fill="#D5F5E3">DMZ</text>

    <!-- App Server -->
    <rect x="630" y="90" width="110" height="70" rx="8" fill="#16A085" filter="url(#sh)"/>
    <text x="685" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="white">⚙️ App Server</text>
    <text x="685" y="135" text-anchor="middle" font-size="10" fill="#D1F2EB">10.10.20.30</text>
    <text x="685" y="150" text-anchor="middle" font-size="9" fill="#D1F2EB">Business Logic</text>

    <!-- Core Banking -->
    <rect x="780" y="90" width="110" height="70" rx="8" fill="#1F618D" filter="url(#sh)"/>
    <text x="835" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🏦 Core Bank</text>
    <text x="835" y="135" text-anchor="middle" font-size="10" fill="#D6EAF8">10.10.20.10</text>
    <text x="835" y="150" text-anchor="middle" font-size="9" fill="#D6EAF8">Temenos T24</text>
  </g>

  <!-- Vertical lifelines -->
  <line x1="85"  y1="160" x2="85"  y2="620" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="235" y1="160" x2="235" y2="620" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="385" y1="160" x2="385" y2="620" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="535" y1="160" x2="535" y2="620" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="685" y1="160" x2="685" y2="620" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="835" y1="160" x2="835" y2="620" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Flow: Request (top to bottom) -->
  <g stroke="#27AE60" stroke-width="2" fill="none">
    <line x1="85" y1="200" x2="230" y2="200" marker-end="url(#arr)"/>
    <line x1="235" y1="245" x2="380" y2="245" marker-end="url(#arr)"/>
    <line x1="385" y1="290" x2="530" y2="290" marker-end="url(#arr)"/>
    <line x1="535" y1="335" x2="680" y2="335" marker-end="url(#arr)"/>
    <line x1="685" y1="380" x2="830" y2="380" marker-end="url(#arr)"/>
  </g>

  <text x="150" y="195" font-size="10" fill="#27AE60" font-weight="bold">1. HTTPS GET /login (Port 443)</text>
  <text x="300" y="240" font-size="10" fill="#27AE60" font-weight="bold">2. Filter + IPS Check</text>
  <text x="450" y="285" font-size="10" fill="#27AE60" font-weight="bold">3. Verify SQLi/XSS</text>
  <text x="600" y="330" font-size="10" fill="#27AE60" font-weight="bold">4. Internal API Call</text>
  <text x="750" y="375" font-size="10" fill="#27AE60" font-weight="bold">5. Query Transaction</text>

  <!-- Flow: Response (bottom to top) -->
  <g stroke="#8E44AD" stroke-width="2" fill="none">
    <line x1="835" y1="430" x2="690" y2="430" marker-end="url(#arr-back)"/>
    <line x1="685" y1="470" x2="540" y2="470" marker-end="url(#arr-back)"/>
    <line x1="535" y1="510" x2="390" y2="510" marker-end="url(#arr-back)"/>
    <line x1="385" y1="550" x2="240" y2="550" marker-end="url(#arr-back)"/>
    <line x1="235" y1="590" x2="90" y2="590" marker-end="url(#arr-back)"/>
  </g>

  <text x="750" y="425" font-size="10" fill="#8E44AD" font-weight="bold">6. Transaction Confirmed</text>
  <text x="600" y="465" font-size="10" fill="#8E44AD" font-weight="bold">7. JSON Response</text>
  <text x="450" y="505" font-size="10" fill="#8E44AD" font-weight="bold">8. Render Page (TLS 1.3)</text>
  <text x="300" y="545" font-size="10" fill="#8E44AD" font-weight="bold">9. Encrypt Response</text>
  <text x="150" y="585" font-size="10" fill="#8E44AD" font-weight="bold">10. Display to Customer</text>

  <!-- Info Panel -->
  <rect x="60" y="640" width="880" height="45" rx="6" fill="#2C3E50" filter="url(#sh)"/>
  <text x="500" y="660" text-anchor="middle" font-size="12" font-weight="bold" fill="white">📊 All Transactions Logged in SIEM (Splunk) + Encrypted Storage (AES-256)</text>
  <text x="500" y="678" text-anchor="middle" font-size="10" fill="#BDC3C7">Latency Target: &lt; 200ms end-to-end | Throughput: 1000+ transactions/sec</text>
</svg>
