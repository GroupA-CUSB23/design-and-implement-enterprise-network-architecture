<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="Arial, sans-serif">
  <defs>
    <filter id="sh">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="#F4F6F7"/>

  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#2C3E50">VLAN Design + Inter-VLAN Routing (Layer 2)</text>

  <!-- Core Switch (L3) -->
  <rect x="350" y="80" width="300" height="80" rx="8" fill="#1F618D" filter="url(#sh)"/>
  <text x="500" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="white">CORE SWITCH (Layer 3)</text>
  <text x="500" y="132" text-anchor="middle" font-size="12" fill="#D6EAF8">Inter-VLAN Routing (SVI)</text>
  <text x="500" y="150" text-anchor="middle" font-size="11" fill="#D6EAF8">Cisco Nexus 9336 with VPC</text>

  <!-- Connections down -->
  <line x1="500" y1="160" x2="500" y2="195" stroke="#34495E" stroke-width="2"/>
  <line x1="120" y1="195" x2="880" y2="195" stroke="#34495E" stroke-width="2"/>

  <!-- VLAN Boxes -->
  <g>
    <line x1="120" y1="195" x2="120" y2="230" stroke="#34495E" stroke-width="2"/>
    <rect x="60" y="230" width="120" height="140" rx="6" fill="#8E44AD" filter="url(#sh)"/>
    <text x="120" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="white">VLAN 10</text>
    <text x="120" y="270" text-anchor="middle" font-size="12" fill="#E8DAEF">MGMT</text>
    <line x1="80" y1="278" x2="160" y2="278" stroke="#E8DAEF" stroke-width="1"/>
    <text x="120" y="298" text-anchor="middle" font-size="10" fill="white">10.10.10.0/24</text>
    <text x="120" y="315" text-anchor="middle" font-size="9" fill="#E8DAEF">Management</text>
    <text x="120" y="330" text-anchor="middle" font-size="9" fill="#E8DAEF">50 Users</text>
    <text x="120" y="355" text-anchor="middle" font-size="9" fill="#F1C40F">Admin Only</text>
  </g>

  <g>
