    <rect x="190" y="230" width="120" height="140" rx="6" fill="#27AE60" filter="url(#sh)"/>
    <text x="250" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="white">VLAN 20</text>
    <text x="250" y="270" text-anchor="middle" font-size="12" fill="#D5F5E3">SERVERS</text>
    <line x1="210" y1="278" x2="290" y2="278" stroke="#D5F5E3" stroke-width="1"/>
    <text x="250" y="298" text-anchor="middle" font-size="10" fill="white">10.10.20.0/24</text>
    <text x="250" y="315" text-anchor="middle" font-size="9" fill="#D5F5E3">Core Banking</text>
    <text x="250" y="330" text-anchor="middle" font-size="9" fill="#D5F5E3">Database</text>
    <text x="250" y="355" text-anchor="middle" font-size="9" fill="#F1C40F">ACL Protected</text>
  </g>

  <g>
    <line x1="380" y1="195" x2="380" y2="230" stroke="#34495E" stroke-width="2"/>
    <rect x="320" y="230" width="120" height="140" rx="6" fill="#3498DB" filter="url(#sh)"/>
    <text x="380" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="white">VLAN 30</text>
    <text x="380" y="270" text-anchor="middle" font-size="12" fill="#D6EAF8">STAFF</text>
    <line x1="340" y1="278" x2="420" y2="278" stroke="#D6EAF8" stroke-width="1"/>
    <text x="380" y="298" text-anchor="middle" font-size="10" fill="white">10.10.30.0/23</text>
    <text x="380" y="315" text-anchor="middle" font-size="9" fill="#D6EAF8">Staff PCs</text>
    <text x="380" y="330" text-anchor="middle" font-size="9" fill="#D6EAF8">510 Users</text>
    <text x="380" y="355" text-anchor="middle" font-size="9" fill="#F1C40F">Filtered</text>
  </g>

  <g>
    <line x1="500" y1="195" x2="500" y2="230" stroke="#34495E" stroke-width="2"/>
    <rect x="440" y="230" width="120" height="140" rx="6" fill="#E74C3C" filter="url(#sh)"/>
    <text x="500" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="white">VLAN 40</text>
    <text x="500" y="270" text-anchor="middle" font-size="12" fill="#FADBD8">ATM</text>
    <line x1="460" y1="278" x2="540" y2="278" stroke="#FADBD8" stroke-width="1"/>
    <text x="500" y="298" text-anchor="middle" font-size="10" fill="white">10.10.40.0/24</text>
    <text x="500" y="315" text-anchor="middle" font-size="9" fill="#FADBD8">ATM Machines</text>
    <text x="500" y="330" text-anchor="middle" font-size="9" fill="#FADBD8">17 Total</text>
    <text x="500" y="355" text-anchor="middle" font-size="9" fill="#F1C40F">PCI-DSS Isolated</text>
  </g>

  <g>
    <line x1="620" y1="195" x2="620" y2="230" stroke="#34495E" stroke-width="2"/>
    <rect x="560" y="230" width="120" height="140" rx="6" fill="#F39C12" filter="url(#sh)"/>
    <text x="620" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="white">VLAN 50</text>
    <text x="620" y="270" text-anchor="middle" font-size="12" fill="#FDEBD0">VOIP</text>
    <line x1="580" y1="278" x2="660" y2="278" stroke="#FDEBD0" stroke-width="1"/>
    <text x="620" y="298" text-anchor="middle" font-size="10" fill="white">10.10.50.0/24</text>
    <text x="620" y="315" text-anchor="middle" font-size="9" fill="#FDEBD0">IP Phones</text>
    <text x="620" y="330" text-anchor="middle" font-size="9" fill="#FDEBD0">300 Users</text>
    <text x="620" y="355" text-anchor="middle" font-size="9" fill="#F1C40F">QoS Priority</text>
