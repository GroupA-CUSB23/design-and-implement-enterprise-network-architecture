    <text x="750" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="white">VLAN 60</text>
    <text x="750" y="270" text-anchor="middle" font-size="12" fill="#D1F2EB">WIFI_CORP</text>
    <line x1="710" y1="278" x2="790" y2="278" stroke="#D1F2EB" stroke-width="1"/>
    <text x="750" y="298" text-anchor="middle" font-size="10" fill="white">10.10.60.0/24</text>
    <text x="750" y="315" text-anchor="middle" font-size="9" fill="#D1F2EB">Wi-Fi Staff</text>
    <text x="750" y="330" text-anchor="middle" font-size="9" fill="#D1F2EB">100 Users</text>
    <text x="750" y="355" text-anchor="middle" font-size="9" fill="#F1C40F">WPA3-Ent</text>
  </g>

  <g>
    <line x1="880" y1="195" x2="880" y2="230" stroke="#34495E" stroke-width="2"/>
    <rect x="820" y="230" width="120" height="140" rx="6" fill="#95A5A6" filter="url(#sh)"/>
    <text x="880" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="white">VLAN 70</text>
    <text x="880" y="270" text-anchor="middle" font-size="12" fill="#ECF0F1">WIFI_GUEST</text>
    <line x1="840" y1="278" x2="920" y2="278" stroke="#ECF0F1" stroke-width="1"/>
    <text x="880" y="298" text-anchor="middle" font-size="10" fill="white">10.10.70.0/24</text>
    <text x="880" y="315" text-anchor="middle" font-size="9" fill="#ECF0F1">Guest Wi-Fi</text>
    <text x="880" y="330" text-anchor="middle" font-size="9" fill="#ECF0F1">100 Users</text>
    <text x="880" y="355" text-anchor="middle" font-size="9" fill="#F1C40F">Internet Only</text>
  </g>

  <!-- Inter-VLAN Routing Flow -->
  <rect x="60" y="400" width="880" height="220" rx="8" fill="white" stroke="#3498DB" stroke-width="2" filter="url(#sh)"/>
  <text x="500" y="425" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C3E50">🔄 Inter-VLAN Routing Flow (Staff → Server Example)</text>
  <line x1="80" y1="435" x2="920" y2="435" stroke="#BDC3C7"/>

  <!-- Flow steps -->
  <g>
    <rect x="80" y="455" width="140" height="60" rx="6" fill="#3498DB"/>
    <text x="150" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="white">1. Staff PC</text>
    <text x="150" y="497" text-anchor="middle" font-size="10" fill="white">10.10.30.10</text>
    <text x="150" y="510" text-anchor="middle" font-size="9" fill="#D6EAF8">VLAN 30</text>

    <polygon points="220,485 240,485 240,478 255,490 240,502 240,495 220,495" fill="#7F8C8D"/>

    <rect x="260" y="455" width="140" height="60" rx="6" fill="#7F8C8D"/>
    <text x="330" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="white">2. Access SW</text>
    <text x="330" y="497" text-anchor="middle" font-size="10" fill="white">802.1Q Tag</text>
    <text x="330" y="510" text-anchor="middle" font-size="9" fill="#ECF0F1">Trunk</text>

    <polygon points="400,485 420,485 420,478 435,490 420,502 420,495 400,495" fill="#7F8C8D"/>

    <rect x="440" y="455" width="140" height="60" rx="6" fill="#1F618D"/>
    <text x="510" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="white">3. Core Switch (L3)</text>
    <text x="510" y="497" text-anchor="middle" font-size="10" fill="white">SVI Vlan30 → Vlan20</text>
    <text x="510" y="510" text-anchor="middle" font-size="9" fill="#D6EAF8">Route Decision</text>

    <polygon points="580,485 600,485 600,478 615,490 600,502 600,495 580,495" fill="#7F8C8D"/>

    <rect x="620" y="455" width="140" height="60" rx="6" fill="#7F8C8D"/>
    <text x="690" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="white">4. Access SW</text>
    <text x="690" y="497" text-anchor="middle" font-size="10" fill="white">VLAN 20 Trunk</text>
    <text x="690" y="510" text-anchor="middle" font-size="9" fill="#ECF0F1">Untag → Port</text>

    <polygon points="760,485 780,485 780,478 795,490 780,502 780,495 760,495" fill="#7F8C8D"/>

    <rect x="800" y="455" width="130" height="60" rx="6" fill="#27AE60"/>
    <text x="865" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="white">5. Server</text>
    <text x="865" y="497" text-anchor="middle" font-size="10" fill="white">10.10.20.10</text>
    <text x="865" y="510" text-anchor="middle" font-size="9" fill="#D5F5E3">VLAN 20</text>
  </g>

  <!-- Security Note -->
  <g font-size="11">
    <text x="80" y="545" font-weight="bold" fill="#C0392B">🔒 Security:</text>
    <text x="170" y="545" fill="#2C3E50">Native VLAN 99 | DHCP Snooping | ARP Inspection | Port Security | BPDU Guard</text>
    <text x="80" y="570" font-weight="bold" fill="#27AE60">✅ Benefits:</text>
    <text x="170" y="570" fill="#2C3E50">Broadcast reduction | Traffic isolation | Flexible IP assignment</text>
    <text x="80" y="595" font-weight="bold" fill="#8E44AD">📋 Compliance:</text>
    <text x="180" y="595" fill="#2C3E50">ATM VLAN isolated for PCI-DSS | Guest Wi-Fi isolated from internal</text>
  </g>
</svg>
