    <rect x="665" y="200" width="120" height="90" rx="6" fill="#229954" filter="url(#sh)"/>
    <text x="725" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="white">SH</text>
    <text x="725" y="240" text-anchor="middle" font-size="10" fill="#D5F5E3">ព្រះសីហនុ</text>
    <line x1="685" y1="248" x2="765" y2="248" stroke="#D5F5E3"/>
    <text x="725" y="265" text-anchor="middle" font-weight="bold" fill="white">10.50.0.0/16</text>
    <text x="725" y="280" text-anchor="middle" fill="#D5F5E3">65,534 IPs</text>

    <line x1="870" y1="170" x2="870" y2="200" stroke="#34495E" stroke-width="2"/>
    <rect x="810" y="200" width="120" height="90" rx="6" fill="#229954" filter="url(#sh)"/>
    <text x="870" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="white">KP</text>
    <text x="870" y="240" text-anchor="middle" font-size="10" fill="#D5F5E3">កំពត</text>
