  <!-- HO Detail VLAN Breakdown -->
  <rect x="50" y="320" width="900" height="230" rx="8" fill="white" stroke="#3498DB" stroke-width="2" filter="url(#sh)"/>
  <text x="500" y="345" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C3E50">Head Office Subnetting (10.10.0.0/16 → VLANs)</text>
  <line x1="70" y1="355" x2="930" y2="355" stroke="#BDC3C7"/>

  <!-- Column Headers -->
  <g font-size="11" font-weight="bold" fill="white">
    <rect x="70" y="365" width="80" height="30" fill="#2C3E50"/>
    <text x="110" y="385" text-anchor="middle">VLAN</text>

