<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Arial, sans-serif">
  <defs>
    <filter id="sh">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1000" height="700" fill="#F4F6F7"/>

  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#2C3E50">IP Addressing Scheme (Layer 3)</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#7F8C8D">RFC 1918 Private Address Space</text>

  <!-- Master Block -->
  <rect x="350" y="80" width="300" height="60" rx="8" fill="#1F618D" filter="url(#sh)"/>
  <text x="500" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="white">10.0.0.0/8</text>
  <text x="500" y="128" text-anchor="middle" font-size="11" fill="#D6EAF8">Master Enterprise Block (16M IPs)</text>

  <!-- Distribution lines -->
  <line x1="500" y1="140" x2="500" y2="170" stroke="#34495E" stroke-width="2"/>
  <line x1="130" y1="170" x2="870" y2="170" stroke="#34495E" stroke-width="2"/>

  <!-- Six Site Blocks -->
  <g font-size="10">
    <line x1="130" y1="170" x2="130" y2="200" stroke="#34495E" stroke-width="2"/>
    <rect x="70" y="200" width="120" height="90" rx="6" fill="#2874A6" filter="url(#sh)"/>
    <text x="130" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="white">HO</text>
    <text x="130" y="240" text-anchor="middle" font-size="10" fill="#D6EAF8">ភ្នំពេញ</text>
    <line x1="90" y1="248" x2="170" y2="248" stroke="#D6EAF8"/>
    <text x="130" y="265" text-anchor="middle" font-weight="bold" fill="white">10.10.0.0/16</text>
    <text x="130" y="280" text-anchor="middle" fill="#D6EAF8">65,534 IPs</text>

    <line x1="278" y1="170" x2="278" y2="200" stroke="#34495E" stroke-width="2"/>
    <rect x="220" y="200" width="120" height="90" rx="6" fill="#229954" filter="url(#sh)"/>
    <text x="278" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="white">SR</text>
    <text x="278" y="240" text-anchor="middle" font-size="10" fill="#D5F5E3">សៀមរាប</text>
    <line x1="240" y1="248" x2="320" y2="248" stroke="#D5F5E3"/>
    <text x="278" y="265" text-anchor="middle" font-weight="bold" fill="white">10.20.0.0/16</text>
    <text x="278" y="280" text-anchor="middle" fill="#D5F5E3">65,534 IPs</text>

    <line x1="425" y1="170" x2="425" y2="200" stroke="#34495E" stroke-width="2"/>
    <rect x="365" y="200" width="120" height="90" rx="6" fill="#229954" filter="url(#sh)"/>
    <text x="425" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="white">BB</text>
    <text x="425" y="240" text-anchor="middle" font-size="10" fill="#D5F5E3">បាត់ដំបង</text>
    <line x1="385" y1="248" x2="465" y2="248" stroke="#D5F5E3"/>
    <text x="425" y="265" text-anchor="middle" font-weight="bold" fill="white">10.30.0.0/16</text>
    <text x="425" y="280" text-anchor="middle" fill="#D5F5E3">65,534 IPs</text>

    <line x1="575" y1="170" x2="575" y2="200" stroke="#34495E" stroke-width="2"/>
    <rect x="515" y="200" width="120" height="90" rx="6" fill="#229954" filter="url(#sh)"/>
    <text x="575" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="white">KC</text>
    <text x="575" y="240" text-anchor="middle" font-size="10" fill="#D5F5E3">កំពង់ចាម</text>
    <line x1="535" y1="248" x2="615" y2="248" stroke="#D5F5E3"/>
    <text x="575" y="265" text-anchor="middle" font-weight="bold" fill="white">10.40.0.0/16</text>
    <text x="575" y="280" text-anchor="middle" fill="#D5F5E3">65,534 IPs</text>

