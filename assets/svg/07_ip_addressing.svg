    <rect x="150" y="395" width="130" height="22" fill="#F8F9F9"/><text x="215" y="410" text-anchor="middle">MGMT</text>
    <rect x="280" y="395" width="150" height="22" fill="#F8F9F9"/><text x="355" y="410" text-anchor="middle">10.10.10.0/24</text>
    <rect x="430" y="395" width="200" height="22" fill="#F8F9F9"/><text x="530" y="410" text-anchor="middle">10.10.10.1 - 254</text>
    <rect x="630" y="395" width="120" height="22" fill="#F8F9F9"/><text x="690" y="410" text-anchor="middle">10.10.10.1</text>
    <rect x="750" y="395" width="180" height="22" fill="#F8F9F9"/><text x="840" y="410" text-anchor="middle">Management</text>

    <rect x="70" y="417" width="80" height="22" fill="#D5F5E3"/><text x="110" y="432" text-anchor="middle">20</text>
    <rect x="150" y="417" width="130" height="22" fill="#EAEDED"/><text x="215" y="432" text-anchor="middle">SERVERS</text>
    <rect x="280" y="417" width="150" height="22" fill="#EAEDED"/><text x="355" y="432" text-anchor="middle">10.10.20.0/24</text>
    <rect x="430" y="417" width="200" height="22" fill="#EAEDED"/><text x="530" y="432" text-anchor="middle">10.10.20.1 - 254</text>
    <rect x="630" y="417" width="120" height="22" fill="#EAEDED"/><text x="690" y="432" text-anchor="middle">10.10.20.1</text>
    <rect x="750" y="417" width="180" height="22" fill="#EAEDED"/><text x="840" y="432" text-anchor="middle">Core Banking, DB</text>

    <rect x="70" y="439" width="80" height="22" fill="#D6EAF8"/><text x="110" y="454" text-anchor="middle">30</text>
    <rect x="150" y="439" width="130" height="22" fill="#F8F9F9"/><text x="215" y="454" text-anchor="middle">STAFF</text>
    <rect x="280" y="439" width="150" height="22" fill="#F8F9F9"/><text x="355" y="454" text-anchor="middle">10.10.30.0/23</text>
    <rect x="430" y="439" width="200" height="22" fill="#F8F9F9"/><text x="530" y="454" text-anchor="middle">10.10.30.1 - 31.254 (510)</text>
    <rect x="630" y="439" width="120" height="22" fill="#F8F9F9"/><text x="690" y="454" text-anchor="middle">10.10.30.1</text>
    <rect x="750" y="439" width="180" height="22" fill="#F8F9F9"/><text x="840" y="454" text-anchor="middle">Staff PCs</text>

    <rect x="70" y="461" width="80" height="22" fill="#FADBD8"/><text x="110" y="476" text-anchor="middle">40</text>
    <rect x="150" y="461" width="130" height="22" fill="#EAEDED"/><text x="215" y="476" text-anchor="middle">ATM</text>
    <rect x="280" y="461" width="150" height="22" fill="#EAEDED"/><text x="355" y="476" text-anchor="middle">10.10.40.0/24</text>
    <rect x="430" y="461" width="200" height="22" fill="#EAEDED"/><text x="530" y="476" text-anchor="middle">10.10.40.1 - 254</text>
    <rect x="630" y="461" width="120" height="22" fill="#EAEDED"/><text x="690" y="476" text-anchor="middle">10.10.40.1</text>
    <rect x="750" y="461" width="180" height="22" fill="#EAEDED"/><text x="840" y="476" text-anchor="middle">ATM (PCI-DSS)</text>

    <rect x="70" y="483" width="80" height="22" fill="#FDEBD0"/><text x="110" y="498" text-anchor="middle">50</text>
    <rect x="150" y="483" width="130" height="22" fill="#F8F9F9"/><text x="215" y="498" text-anchor="middle">VOIP</text>
    <rect x="280" y="483" width="150" height="22" fill="#F8F9F9"/><text x="355" y="498" text-anchor="middle">10.10.50.0/24</text>
    <rect x="430" y="483" width="200" height="22" fill="#F8F9F9"/><text x="530" y="498" text-anchor="middle">10.10.50.1 - 254</text>
    <rect x="630" y="483" width="120" height="22" fill="#F8F9F9"/><text x="690" y="498" text-anchor="middle">10.10.50.1</text>
    <rect x="750" y="483" width="180" height="22" fill="#F8F9F9"/><text x="840" y="498" text-anchor="middle">IP Phones</text>

    <rect x="70" y="505" width="80" height="22" fill="#D1F2EB"/><text x="110" y="520" text-anchor="middle">60/70</text>
    <rect x="150" y="505" width="130" height="22" fill="#EAEDED"/><text x="215" y="520" text-anchor="middle">WIFI</text>
    <rect x="280" y="505" width="150" height="22" fill="#EAEDED"/><text x="355" y="520" text-anchor="middle">10.10.60/70.0/24</text>
    <rect x="430" y="505" width="200" height="22" fill="#EAEDED"/><text x="530" y="520" text-anchor="middle">Corp + Guest</text>
    <rect x="630" y="505" width="120" height="22" fill="#EAEDED"/><text x="690" y="520" text-anchor="middle">10.10.60.1/70.1</text>
    <rect x="750" y="505" width="180" height="22" fill="#EAEDED"/><text x="840" y="520" text-anchor="middle">Wi-Fi Corp + Guest</text>
