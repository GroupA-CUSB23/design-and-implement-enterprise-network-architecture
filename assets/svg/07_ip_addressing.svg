  <!-- WAN P2P Info -->
  <rect x="50" y="565" width="900" height="115" rx="8" fill="white" stroke="#E67E22" stroke-width="2" filter="url(#sh)"/>
  <text x="500" y="588" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50">🔗 WAN P2P Links (172.16.1.0/24 with /30 per link)</text>

  <g font-size="11" fill="#2C3E50">
    <text x="80" y="615">• HO ↔ SR:</text>       <text x="170" y="615" font-weight="bold">172.16.1.0/30</text>   <text x="290" y="615" font-style="italic" fill="#7F8C8D">(.1 / .2)</text>
    <text x="380" y="615">• HO ↔ BB:</text>      <text x="470" y="615" font-weight="bold">172.16.1.4/30</text>  <text x="590" y="615" font-style="italic" fill="#7F8C8D">(.5 / .6)</text>
    <text x="680" y="615">• HO ↔ KC:</text>      <text x="770" y="615" font-weight="bold">172.16.1.8/30</text>  <text x="890" y="615" font-style="italic" fill="#7F8C8D">(.9/.10)</text>

    <text x="80" y="640">• HO ↔ SH:</text>       <text x="170" y="640" font-weight="bold">172.16.1.12/30</text> <text x="290" y="640" font-style="italic" fill="#7F8C8D">(.13/.14)</text>
    <text x="380" y="640">• HO ↔ KP:</text>      <text x="470" y="640" font-weight="bold">172.16.1.16/30</text> <text x="590" y="640" font-style="italic" fill="#7F8C8D">(.17/.18)</text>
    <text x="680" y="640">• DMZ:</text>          <text x="750" y="640" font-weight="bold">172.16.99.0/24</text>

    <text x="80" y="665" fill="#27AE60" font-weight="bold">✅ VLSM Design:</text> <text x="200" y="665">/16 for sites, /24 for VLANs, /30 for P2P links</text>
  </g>
</svg>
