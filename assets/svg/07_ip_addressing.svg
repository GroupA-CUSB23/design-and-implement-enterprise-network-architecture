    <text x="355" y="385" text-anchor="middle">Subnet</text>

    <rect x="430" y="365" width="200" height="30" fill="#2C3E50"/>
    <text x="530" y="385" text-anchor="middle">Range</text>

    <rect x="630" y="365" width="120" height="30" fill="#2C3E50"/>
