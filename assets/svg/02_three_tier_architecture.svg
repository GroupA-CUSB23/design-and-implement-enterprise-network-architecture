<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#E74C3C"/>
    </linearGradient>
    <linearGradient id="dist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E86C1"/>
      <stop offset="100%" stop-color="#3498DB"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#229954"/>
      <stop offset="100%" stop-color="#27AE60"/>
    </linearGradient>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="550" fill="#ECF0F1"/>

  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#2C3E50">Three-Tier Hierarchical Architecture</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#7F8C8D">Cisco Enterprise Network Design</text>

  <!-- Core Layer -->
  <rect x="200" y="90" width="400" height="110" rx="12" fill="url(#core)" filter="url(#sh)"/>
  <text x="400" y="125" text-anchor="middle" font-size="20" font-weight="bold" fill="white">CORE LAYER</text>
  <text x="400" y="150" text-anchor="middle" font-size="14" fill="white">Backbone High-Speed Switching (100 Gbps)</text>
  <text x="400" y="172" text-anchor="middle" font-size="12" fill="#FADBD8">Cisco Nexus 9336C-FX2 (x2 HA with VPC)</text>
  <text x="400" y="190" text-anchor="middle" font-size="11" fill="#FADBD8">Focus: Fast Switching, Low Latency, High Throughput</text>

  <!-- Connection Core to Dist -->
  <line x1="400" y1="200" x2="400" y2="240" stroke="#34495E" stroke-width="3"/>

  <!-- Distribution Layer -->
  <rect x="150" y="240" width="500" height="110" rx="12" fill="url(#dist)" filter="url(#sh)"/>
  <text x="400" y="275" text-anchor="middle" font-size="20" font-weight="bold" fill="white">DISTRIBUTION LAYER</text>
  <text x="400" y="300" text-anchor="middle" font-size="14" fill="white">Policy Enforcement + Inter-VLAN Routing</text>
  <text x="400" y="322" text-anchor="middle" font-size="12" fill="#D6EAF8">Cisco Catalyst 9500-24Y4C (x4 with StackWise Virtual)</text>
  <text x="400" y="340" text-anchor="middle" font-size="11" fill="#D6EAF8">L3 Routing, ACL, QoS, Aggregation</text>

  <!-- Connection Dist to Access -->
  <line x1="400" y1="350" x2="400" y2="390" stroke="#34495E" stroke-width="3"/>

  <!-- Access Layer -->
  <rect x="100" y="390" width="600" height="110" rx="12" fill="url(#acc)" filter="url(#sh)"/>
  <text x="400" y="425" text-anchor="middle" font-size="20" font-weight="bold" fill="white">ACCESS LAYER</text>
  <text x="400" y="450" text-anchor="middle" font-size="14" fill="white">End-User Connectivity + PoE+</text>
  <text x="400" y="472" text-anchor="middle" font-size="12" fill="#D5F5E3">Cisco Catalyst 9200-48P (x20 with Stacking)</text>
  <text x="400" y="490" text-anchor="middle" font-size="11" fill="#D5F5E3">PCs, IP Phones, Wireless APs</text>

  <text x="400" y="530" text-anchor="middle" font-size="12" font-style="italic" fill="#7F8C8D">Scalability + Manageability + Fault Isolation + Cost-effective</text>
</svg>
